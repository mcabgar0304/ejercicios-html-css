<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body style="background-color: rgb(99, 162, 162); align-content: center; min-height: 100vh; justify-items: center;">

    <form style="background-color: rgb(176, 237, 237);border: 2px solid black; width: 30%; padding: 15px;"
        action="inscrito.html">
        <div style="text-align: center;">
            <label class="titulo"
                for="ftitle">
                Registro de Estudiantes
            </label>
        </div>
        <br>

        <!-- DATOS PERSONALES -->
        <label class="subtitulo"
            for="ldatospersonales">
            Datos Personales
        </label>
        <br>

        <!-- 1ra fila -->
        <label for="fname">Nombre</label>
        <label style="position: relative; left: 120px;" for="fsurname">Apellidos</label>
        <br>

        <input type="text" name="iname" id="iname" required>
        <input style="width: 250px;" type="text" name="isurname" id="isurname" required>
        <br><br>

        <!-- 2da fila -->
        <label for="ffecha">Fecha de Nacimiento</label>
        <label style="position: relative; left: 35px;" for="fdni">DNI</label>
        <br>

        <input style="width: 165px;" type="date" name="ifecha" id="ifecha" required>
        <input style="width: 150px;" type="text" name="idni" id="idni" required>
        <br><br>

        <!-- 3ra fila -->
        <label for="fcorreo">Correo Electrónico</label>
        <label style="position: relative; left: 50px;" for="ftelefono">N.º de Teléfono</label>
        <br>

        <input type="email" name="icorreo" id="icorreo" required>
        <input style="width: 200px;" type="number" name="itelefono" id="itelefono" required>
        <br><br>

        <!-- DATOS DEL CICLO -->
        <label class="subtitulo"
            for="ldatosciclo">
            Datos del Ciclo
        </label>
        <br>

        <!-- Ciclo matriculado -->
        <label for="imatriculado">Ciclo Matriculado</label>
        <br>
        <input style="width: 300px;" type="text" name="imatriculado" id="imatriculado" required>
        <br>

        <!-- Modalidad -->
        <label>Modalidad</label>
        <br>

        <label>
            <input type="radio" name="modalidad" id="pres" value="presencial" required>
            Presencial
        </label>

        <label>
            <input type="radio" name="modalidad" id="semipres" value="semipresencial">
            Semipresencial
        </label>

        <label>
            <input type="radio" name="modalidad" id="online" value="online">
            Online
        </label>
        <br>

        <!-- Turno -->
        <label>Turno</label>
        <br>

        <label>
            <input type="radio" name="turno" id="manana" value="mañana" required>
            Mañana
        </label>

        <label>
            <input type="radio" name="turno" id="tarde" value="tarde">
            Tarde
        </label>
        <br><br>

        <!-- Política de privacidad -->
        <label>
            <input type="checkbox" name="politica" id="politica" required>
            Acepto la política de privacidad
        </label>
        <br><br>

        <!-- Botón de envío -->
        <div style="text-align: center;">
            <input class="submit" type="submit" value="Inscribirse">
        </div>

    </form>

</body>

</html>
